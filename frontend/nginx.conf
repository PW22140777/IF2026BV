server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Aplicación de una sola página: cualquier otra ruta devuelve index.html.
    # index.html no se guarda en caché: siempre apunta a los archivos de la versión actual
    # (sin esto, el navegador puede seguir mostrando la versión anterior después de reconstruir)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
